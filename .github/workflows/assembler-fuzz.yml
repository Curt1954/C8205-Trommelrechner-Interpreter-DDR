# Naechtlicher Zufallstest des Assemblers c82ass (Regressionstest/fuzz.py unter AddressSanitizer/UBSan).
# Gefundene Faelle werden als Artefakt abgelegt. Von Hand startbar ueber "Run workflow".
name: assembler-fuzz
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      laeufe:
        description: 'Anzahl Laeufe'
        default: '2000'
jobs:
  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Assembler
    steps:
      - uses: actions/checkout@v4
      - name: Zufallstest
        run: make fuzz FUZZ_N=${{ github.event.inputs.laeufe || '2000' }} FUZZ_SEED=${{ github.run_number }}
      - name: Funde sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-funde
          path: /tmp/c82fuzzwork/fund_*
